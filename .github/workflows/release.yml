name: Plugin Release
on:
  push:
    branches:
      - main
    paths:
      - 'package.v3.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Check plugin versions
        run: python .github/scripts/check_plugin_versions.py --check-bump HEAD~1 package.v3.json

      - name: Build and release changed plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pkg_file="package.v3.json"
          : > processed_tags.txt

          # 只有显式声明 release=true 的插件走 ZIP 分发，其余走源码目录安装。
          mapfile -t entries < <(jq -r 'to_entries | map(select(.value.release == true)) | .[] | "\(.key)|\(.value.version)"' "$pkg_file")

          if [ "${#entries[@]}" -eq 0 ]; then
            echo "No plugins with release=true in $pkg_file"
            exit 0
          fi

          for entry in "${entries[@]}"; do
            plugin_id="${entry%%|*}"
            plugin_version="${entry##*|}"
            plugin_id_lc="$(echo "$plugin_id" | tr '[:upper:]' '[:lower:]')"
            plugin_dir="plugins.v3/${plugin_id_lc}"

            if [ ! -d "$plugin_dir" ]; then
              echo "WARN: directory $plugin_dir not found, skip."
              continue
            fi

            tag="${plugin_id}_v${plugin_version}"
            asset="${plugin_id_lc}_v${plugin_version}.zip"
            release_notes="$(jq -r --arg plugin_id "$plugin_id" --arg version "v$plugin_version" '.[$plugin_id].history[$version] // empty' "$pkg_file")"
            if [ -z "$release_notes" ]; then
              release_notes="Automated release of $plugin_id $plugin_version"
            fi

            if grep -qxF "$tag" processed_tags.txt; then
              echo "Tag $tag already processed, skip."
              continue
            fi

            prev_tag="$(git tag --list "${plugin_id}_v*" --sort=-version:refname | head -n 1 || true)"
            changed=1
            if [ -n "$prev_tag" ]; then
              if git diff --quiet "$prev_tag" -- "$plugin_dir"; then
                changed=0
              fi
            fi

            if [ "$changed" -eq 0 ]; then
              echo "No changes in $plugin_dir since $prev_tag, skip packaging $plugin_id."
              if gh release view "$tag" >/dev/null 2>&1; then
                gh release edit "$tag" --notes "$release_notes"
              fi
              echo "$tag" >> processed_tags.txt
              continue
            fi

            echo "Packing $plugin_id from $plugin_dir -> $asset"
            rm -f "$asset"
            (cd "$(dirname "$plugin_dir")" && zip -r "$GITHUB_WORKSPACE/$asset" "$(basename "$plugin_dir")" \
              -x "*/__pycache__/*" -x "*.pyc" -x "*/node_modules/*" -x "*/src/*") >/dev/null

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag exists, deleting..."
              gh release delete "$tag" -y
              git push origin :refs/tags/"$tag" || true
            fi
            git tag -d "$tag" >/dev/null 2>&1 || true

            echo "Creating release $tag"
            gh release create "$tag" "$asset" --title "$tag" --notes "$release_notes" --latest --target "$GITHUB_SHA"
            echo "$tag" >> processed_tags.txt
          done
